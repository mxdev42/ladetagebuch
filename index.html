<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ladetagebuch">
<meta name="theme-color" content="#0f0f0f">
<title>Ladetagebuch · CUPRA Leon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  /* Lokale Fonts — gleicher Inhalt wie Google Fonts CSS, nur lokal hinterlegt
     für vollständige Offline-Funktion. Syne ist eine Variable Font, deshalb
     reicht eine Datei pro Unicode-Range für alle Gewichte. */
  @font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/dmmono-400.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('fonts/dmmono-400-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('fonts/dmmono-500.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 500; font-display: swap;
    src: url('fonts/dmmono-500-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Syne'; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url('fonts/syne.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Syne'; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url('fonts/syne-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #242424;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
    --text: #f0f0f0; --text2: #888; --text3: #555;
    --accent: #e8ff47; --accent2: #b8cc2e; --danger: #ff4d4d;
    --radius: 12px; --radius-sm: 8px;
    --font-display: 'Syne', sans-serif; --font-mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font-display); }
  body { min-height: 100vh; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }

  header { padding: calc(20px + env(safe-area-inset-top)) 20px 0; }
  .header-inner { display: flex; justify-content: space-between; align-items: flex-start; }
  .app-title { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); }
  .car-label { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .accent-dot { color: var(--accent); }

  .stats-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 20px; }
  .stat-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 12px; }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 600; line-height: 1; }
  .stat-value.accent { color: var(--accent); }
  .stat-unit { font-size: 11px; color: var(--text2); font-family: var(--font-mono); margin-top: 2px; }

  .section { padding: 0 20px 20px; }
  .card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
  .card-title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); margin-bottom: 16px; }

  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
  .mode-btn { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); font-family: var(--font-mono); font-size: 12px; padding: 10px; cursor: pointer; text-align: center; transition: all 0.15s; -webkit-appearance: none; }
  .mode-btn.active { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 500; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); }

  input[type="date"], input[type="number"], select {
    background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); font-family: var(--font-mono); font-size: 15px;
    padding: 11px 12px; width: 100%; -webkit-appearance: none; appearance: none; outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(0.4); }
  select option { background: var(--bg3); }

  .loss-row { background: var(--bg3); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 12px; }
  .loss-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .loss-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); }
  .loss-value { font-size: 15px; font-weight: 500; color: var(--accent); font-family: var(--font-mono); }
  input[type="range"] { -webkit-appearance: none; width: 100%; height: 3px; background: var(--border2); border-radius: 2px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 0 3px rgba(232,255,71,0.15); }
  .range-hints { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--text3); font-family: var(--font-mono); }

  .preview-box { background: var(--bg3); border-left: 2px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 10px 14px; margin-bottom: 14px; font-family: var(--font-mono); font-size: 13px; color: var(--text2); min-height: 40px; display: flex; align-items: center; }
  .preview-box.active { color: var(--text); }
  .preview-kwh { color: var(--accent); font-weight: 500; }

  .btn { width: 100%; padding: 14px; background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--radius-sm); font-family: var(--font-display); font-size: 14px; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; transition: background 0.15s, transform 0.1s; -webkit-appearance: none; }
  .btn:active { background: var(--accent2); transform: scale(0.98); }
  .btn-ghost { background: transparent; color: var(--text2); border: 0.5px solid var(--border2); font-size: 12px; padding: 8px 14px; width: auto; border-radius: var(--radius-sm); font-family: var(--font-mono); cursor: pointer; -webkit-appearance: none; transition: color 0.15s, border-color 0.15s; }
  .btn-ghost:active { color: var(--text); }
  .btn-danger { background: transparent; color: var(--danger); border: 0.5px solid var(--danger); font-size: 12px; padding: 8px 14px; width: auto; border-radius: var(--radius-sm); font-family: var(--font-mono); cursor: pointer; -webkit-appearance: none; }

  /* iCloud sync bar */
  .sync-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .sync-bar .btn-ghost { flex: 1; text-align: center; padding: 10px 8px; font-size: 11px; }
  .sync-bar .btn-ghost.export { border-color: var(--accent); color: var(--accent); }

  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .session-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border); gap: 8px; }
  .session-item:last-child { border-bottom: none; padding-bottom: 0; }
  .session-left { flex: 1; min-width: 0; }
  .session-date { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }
  .session-soc { font-size: 14px; color: var(--text); margin: 2px 0; }
  .session-meta { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }
  .session-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .session-kwh { font-size: 15px; font-weight: 500; font-family: var(--font-mono); }
  .session-cost { font-size: 13px; font-family: var(--font-mono); color: var(--accent); }
  .btn-del { background: transparent; border: 0.5px solid var(--border); border-radius: 6px; color: var(--text3); font-size: 14px; padding: 4px 8px; cursor: pointer; -webkit-appearance: none; }
  .btn-del:active { color: var(--danger); border-color: var(--danger); }

  .empty-state { text-align: center; padding: 32px 0; color: var(--text3); font-size: 13px; font-family: var(--font-mono); }

  .install-banner { margin: 0 20px 12px; background: var(--bg2); border: 0.5px solid var(--accent); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .install-text { font-size: 12px; color: var(--text2); font-family: var(--font-mono); line-height: 1.5; }
  .install-text strong { color: var(--accent); }

  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #0f0f0f; font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 10px 20px; border-radius: 100px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }

  /* file input hidden */
  #file-import { display: none; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="app-title">Ladetagebuch</div>
      <div class="car-label">CUPRA Leon<span class="accent-dot">.</span></div>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-label">Gesamt</div>
    <div class="stat-value accent" id="stat-kwh">0.00</div>
    <div class="stat-unit">kWh</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Kosten</div>
    <div class="stat-value" id="stat-cost">0.00</div>
    <div class="stat-unit">Euro</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Ladungen</div>
    <div class="stat-value" id="stat-count">0</div>
    <div class="stat-unit">gesamt</div>
  </div>
</div>

<div id="install-banner" class="install-banner hidden">
  <div class="install-text"><strong>Als App installieren:</strong><br>Safari → Teilen → "Zum Home-Bildschirm"</div>
  <button class="btn-ghost" onclick="this.closest('.install-banner').classList.add('hidden')">✕</button>
</div>

<!-- iCloud Sync Bar -->
<div class="section" style="padding-bottom:0;">
  <div class="sync-bar">
    <button class="btn-ghost export" onclick="exportToiCloud()">☁️ In iCloud sichern</button>
    <button class="btn-ghost" onclick="document.getElementById('file-import').click()">📂 Aus iCloud laden</button>
  </div>
  <input type="file" id="file-import" accept=".json" onchange="importFromFile(event)" />
</div>

<div class="section">
  <div class="card">
    <div class="card-title">Neue Ladung</div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-soc" onclick="setMode('soc')">SOC % eingeben</button>
      <button class="mode-btn" id="btn-kwh" onclick="setMode('kwh')">kWh direkt</button>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Datum</label>
        <input type="date" id="input-date" />
      </div>
      <div class="form-group" id="group-power">
        <label>App zeigt</label>
        <select id="power-select" onchange="updateLoss()">
          <option value="10">~2.0 kW (10A)</option>
          <option value="8">~1.6 kW (8A)</option>
          <option value="6">~1.0 kW (6A)</option>
        </select>
      </div>
    </div>

    <div id="soc-inputs">
      <div class="form-row">
        <div class="form-group">
          <label>SOC Start %</label>
          <input type="number" id="soc-start" min="0" max="100" placeholder="z.B. 21" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label>SOC Ende %</label>
          <input type="number" id="soc-end" min="0" max="100" placeholder="z.B. 49" oninput="updatePreview()" />
        </div>
      </div>
      <div class="loss-row">
        <div class="loss-header">
          <span class="loss-label">OBC Ladeverlust</span>
          <span class="loss-value" id="loss-display">12%</span>
        </div>
        <input type="range" id="loss-slider" min="8" max="25" step="1" value="12" oninput="onSlider()" />
        <div class="range-hints"><span>8% schnell</span><span>25% langsam</span></div>
      </div>
    </div>

    <div id="kwh-inputs" class="hidden">
      <div class="form-row">
        <div class="form-group full">
          <label>kWh (bekannter Wert)</label>
          <input type="number" id="kwh-direct" min="0" step="0.01" placeholder="z.B. 5.60" oninput="updatePreview()" />
        </div>
      </div>
    </div>

    <div class="preview-box" id="preview">Werte eingeben für Vorschau …</div>
    <button class="btn" onclick="addSession()">+ Ladung speichern</button>
  </div>
</div>

<div class="section">
  <div class="card">
    <div class="history-header">
      <div class="card-title" style="margin-bottom:0;">Ladehistorie</div>
      <button class="btn-ghost" onclick="exportCSV()" style="font-size:11px;">CSV Export</button>
    </div>
    <div id="sessions-list"><div class="empty-state">Noch keine Ladungen eingetragen.</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PRICE = 0.38;
const NET_KWH = 19.7;
const LOSS_BY_A = { '10': 12, '8': 15, '6': 20 };
const STORE_KEY = 'cupra_ladetagebuch_v1';
let sessions = [];
let currentMode = 'soc';

function load() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) sessions = JSON.parse(r); } catch(e) { sessions = []; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); } catch(e) {}
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-soc').classList.toggle('active', mode === 'soc');
  document.getElementById('btn-kwh').classList.toggle('active', mode === 'kwh');
  document.getElementById('soc-inputs').classList.toggle('hidden', mode !== 'soc');
  document.getElementById('kwh-inputs').classList.toggle('hidden', mode !== 'kwh');
  document.getElementById('group-power').classList.toggle('hidden', mode !== 'soc');
  resetPreview();
}

function getLoss() { return parseInt(document.getElementById('loss-slider').value); }

function updateLoss() {
  const a = document.getElementById('power-select').value;
  document.getElementById('loss-slider').value = LOSS_BY_A[a];
  document.getElementById('loss-display').textContent = LOSS_BY_A[a] + '%';
  updatePreview();
}

function onSlider() {
  document.getElementById('loss-display').textContent = getLoss() + '%';
  updatePreview();
}

function calcKwh(start, end, loss) {
  return (NET_KWH * (end - start) / 100) / (1 - loss / 100);
}

function updatePreview() {
  const box = document.getElementById('preview');
  if (currentMode === 'soc') {
    const s = parseFloat(document.getElementById('soc-start').value);
    const e = parseFloat(document.getElementById('soc-end').value);
    if (!isNaN(s) && !isNaN(e) && e > s && s >= 0 && e <= 100) {
      const kwh = calcKwh(s, e, getLoss());
      box.innerHTML = '<span class="preview-kwh">' + kwh.toFixed(2) + ' kWh</span>&nbsp;·&nbsp;' + (kwh * PRICE).toFixed(2) + ' €&nbsp;·&nbsp;' + getLoss() + '% Verlust';
      box.classList.add('active');
    } else resetPreview();
  } else {
    const k = parseFloat(document.getElementById('kwh-direct').value);
    if (!isNaN(k) && k > 0) {
      box.innerHTML = '<span class="preview-kwh">' + k.toFixed(2) + ' kWh</span>&nbsp;·&nbsp;' + (k * PRICE).toFixed(2) + ' €';
      box.classList.add('active');
    } else resetPreview();
  }
}

function resetPreview() {
  const box = document.getElementById('preview');
  box.textContent = 'Werte eingeben für Vorschau …';
  box.classList.remove('active');
}

function addSession() {
  const date = document.getElementById('input-date').value || today();
  let kwh, label, meta;

  if (currentMode === 'soc') {
    const s = parseFloat(document.getElementById('soc-start').value);
    const e = parseFloat(document.getElementById('soc-end').value);
    if (isNaN(s) || isNaN(e) || e <= s || s < 0 || e > 100) { showToast('SOC-Werte prüfen!'); return; }
    const a = document.getElementById('power-select').value;
    const loss = getLoss();
    const powerLabel = a === '10' ? '~2.0 kW' : a === '8' ? '~1.6 kW' : '~1.0 kW';
    kwh = parseFloat(calcKwh(s, e, loss).toFixed(3));
    label = s + '% → ' + e + '%';
    meta = powerLabel + ' · ' + loss + '% Verlust';
    document.getElementById('soc-start').value = '';
    document.getElementById('soc-end').value = '';
  } else {
    kwh = parseFloat(parseFloat(document.getElementById('kwh-direct').value).toFixed(3));
    if (isNaN(kwh) || kwh <= 0) { showToast('kWh-Wert prüfen!'); return; }
    label = kwh.toFixed(2) + ' kWh (direkt)';
    meta = 'Direkteingabe';
    document.getElementById('kwh-direct').value = '';
  }

  sessions.unshift({ id: Date.now(), date, kwh, label, meta });
  save();
  renderAll();
  resetPreview();
  showToast('Ladung gespeichert ✓');
}

function removeSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  save();
  renderAll();
  showToast('Eintrag gelöscht');
}

function renderAll() {
  const totalKwh = sessions.reduce((a, s) => a + s.kwh, 0);
  document.getElementById('stat-kwh').textContent = totalKwh.toFixed(2);
  document.getElementById('stat-cost').textContent = (totalKwh * PRICE).toFixed(2);
  document.getElementById('stat-count').textContent = sessions.length;

  const list = document.getElementById('sessions-list');
  if (sessions.length === 0) { list.innerHTML = '<div class="empty-state">Noch keine Ladungen eingetragen.</div>'; return; }
  list.innerHTML = sessions.map(s => `
    <div class="session-item">
      <div class="session-left">
        <div class="session-date">${s.date}</div>
        <div class="session-soc">${s.label}</div>
        <div class="session-meta">${s.meta}</div>
      </div>
      <div class="session-right">
        <div>
          <div class="session-kwh">${s.kwh.toFixed(2)} kWh</div>
          <div class="session-cost">${(s.kwh * PRICE).toFixed(2)} €</div>
        </div>
        <button class="btn-del" onclick="removeSession(${s.id})">✕</button>
      </div>
    </div>
  `).join('');
}

// ─── iCloud Export ────────────────────────────────────────

function exportToiCloud() {
  const data = { eintraege: sessions, exportiert: new Date().toISOString(), version: 1 };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);

  // iOS Share Sheet via Web Share API
  if (navigator.share) {
    // Datei über Share Sheet teilen → "In Dateien sichern" → iCloud Drive
    const file = new File([blob], 'ladetagebuch.json', { type: 'application/json' });
    navigator.share({
      files: [file],
      title: 'Ladetagebuch CUPRA Leon',
    }).then(() => {
      showToast('Gespeichert ✓');
    }).catch(() => {
      // Fallback: direkter Download
      triggerDownload(url);
    });
  } else {
    // Desktop: direkter Download
    triggerDownload(url);
    showToast('JSON heruntergeladen ✓');
  }
  URL.revokeObjectURL(url);
}

function triggerDownload(url) {
  const a = document.createElement('a');
  a.href = url; a.download = 'ladetagebuch.json'; a.click();
}

// ─── iCloud Import ────────────────────────────────────────

function importFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      // Unterstützt beide Formate: Array direkt oder {eintraege: [...]}
      const eintraege = Array.isArray(data) ? data : (data.eintraege || []);
      if (!Array.isArray(eintraege)) throw new Error('Ungültiges Format');

      const confirm = window.confirm(
        eintraege.length + ' Einträge gefunden.\n\nVorhandene Daten ersetzen oder zusammenführen?\n\nOK = Ersetzen\nAbbrechen = Zusammenführen'
      );

      if (confirm) {
        sessions = eintraege;
      } else {
        // Merge: bestehende IDs nicht doppelt
        const existingIds = new Set(sessions.map(s => s.id));
        const neu = eintraege.filter(s => !existingIds.has(s.id));
        sessions = [...sessions, ...neu].sort((a, b) => b.id - a.id);
      }

      save();
      renderAll();
      showToast(eintraege.length + ' Einträge geladen ✓');
    } catch(err) {
      alert('Fehler beim Laden: Ungültige JSON-Datei');
    }
  };
  reader.readAsText(file);
  // Input zurücksetzen damit dieselbe Datei nochmal geladen werden kann
  event.target.value = '';
}

// ─── CSV Export ───────────────────────────────────────────

function exportCSV() {
  if (sessions.length === 0) { showToast('Keine Daten'); return; }
  const totalKwh = sessions.reduce((a, s) => a + s.kwh, 0);
  let csv = 'Datum,Beschreibung,Details,kWh,Kosten EUR\n';
  sessions.forEach(s => { csv += `${s.date},"${s.label}","${s.meta}",${s.kwh.toFixed(3)},${(s.kwh * PRICE).toFixed(2)}\n`; });
  csv += `\nGesamt,,,${totalKwh.toFixed(3)},${(totalKwh * PRICE).toFixed(2)}\n`;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  if (navigator.share) {
    const file = new File([blob], 'ladetagebuch.csv', { type: 'text/csv' });
    navigator.share({ files: [file], title: 'Ladetagebuch CSV' }).catch(() => triggerDownload(url));
  } else {
    const a = document.createElement('a'); a.href = url; a.download = 'ladetagebuch.csv'; a.click();
  }
  URL.revokeObjectURL(url);
}

// ─── Helpers ──────────────────────────────────────────────

function today() { return new Date().toISOString().split('T')[0]; }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function checkInstallBanner() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS && !window.navigator.standalone) {
    document.getElementById('install-banner').classList.remove('hidden');
  }
}

load(); renderAll();
document.getElementById('input-date').value = today();
checkInstallBanner();

// ─── Service Worker (Offline-Cache) ───────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
